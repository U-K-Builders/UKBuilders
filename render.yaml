services:
  - type: web
    name: ukbuilders
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    disk:
      name: ukbuilders-db
      mountPath: /app/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_HASH
        sync: false
