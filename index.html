<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.K. Builders | Luxury Residences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#0A1828" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/images/Building/Justin%20Night%20View.jpg" fetchpriority="high">
    <script>
      (function(){
        var t=localStorage.getItem('ukb-theme');
        if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}
        var sz=['','acc-text-lg','acc-text-xl'];
        var cm=['','acc-deuteranopia','acc-protanopia','acc-tritanopia','acc-greyscale'];
        var si=parseInt(localStorage.getItem('ukb-textsize')||'0',10);
        var ci=parseInt(localStorage.getItem('ukb-colormode')||'0',10);
        if(sz[si])document.documentElement.classList.add(sz[si]);
        if(cm[ci])document.documentElement.classList.add(cm[ci]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
